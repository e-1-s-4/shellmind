[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/shellmind/shellmind"
homepage = "https://shellmind.dev"
description = "AI-powered autocomplete and command intelligence for your terminal."
authors = ["shellmind contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
